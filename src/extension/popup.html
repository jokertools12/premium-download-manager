<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Tahoma, sans-serif; }
    body { width: 320px; background: #0b0f1a; color: #e8edf7; font-size: 13px; }
    .head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; background: linear-gradient(135deg, #4f8cff, #7b5cff);
      font-weight: 700; font-size: 13.5px;
    }
    .head .ver { margin-inline-start: auto; font-size: 10.5px; opacity: .85; font-weight: 400; }
    .sec { padding: 10px 12px; border-bottom: 1px solid #1c2740; }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
    .row label { flex: 1; cursor: pointer; }
    .row input[type=checkbox] { width: 15px; height: 15px; accent-color: #4f8cff; }
    .row input[type=number], .row input[type=text] {
      background: #151d30; border: 1px solid #232f4d; color: #e8edf7;
      border-radius: 7px; padding: 5px 8px; width: 70px; outline: none;
    }
    .row input[type=text] { width: 100%; }
    .hint { color: #8b98b8; font-size: 11px; line-height: 1.6; }
    .recent { max-height: 130px; overflow-y: auto; }
    .recent .item {
      padding: 5px 8px; border-radius: 7px; background: #111726;
      margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      direction: ltr; text-align: left; color: #a9b7d9; font-size: 11px;
    }
    .btn {
      width: 100%; margin-top: 6px; padding: 7px;
      background: #151d30; color: #e8edf7; border: 1px solid #232f4d;
      border-radius: 8px; cursor: pointer; font-size: 12px;
    }
    .btn:hover { border-color: #4f8cff; }
    .status { padding: 6px 12px; font-size: 11px; }
    .on { color: #34d399; } .off { color: #f87171; }
    .del { background: none; border: none; color: #f87171; cursor: pointer; margin-inline-start: 6px; }
  </style>
</head>
<body>
  <div class="head">⚡ Premium DM <span class="ver" id="ver"></span></div>

  <div class="sec">
    <div class="row">
      <label for="enabled">الاعتراض على التحميلات</label>
      <input type="checkbox" id="enabled" checked>
    </div>
    <div class="row">
      <label for="minSize">الحد الأدنى للحجم (MB)</label>
      <input type="number" id="minSize" min="0" value="0">
    </div>
    <div class="hint">الملفات الأصغر من هذا الحجم يكمل المتصفح تحميلها بنفسه. كليك يمين على أي رابط يتجاوز الفلتر دائماً.</div>
  </div>

  <div class="sec">
    <div class="hint" style="margin-bottom:5px">المواقع المتجاهلة (اسم الموقع في كل سطر):</div>
    <div class="row"><input type="text" id="newSite" placeholder="example.com" dir="ltr"></div>
    <button class="btn" id="addSite">＋ إضافة للمتجاهلة</button>
    <div id="sites" style="margin-top:6px"></div>
  </div>

  <div class="sec">
    <div class="hint" style="margin-bottom:5px">آخر ما تم التقاطه:</div>
    <div class="recent" id="recent"><div class="hint">لا شيء بعد</div></div>
  </div>

  <div class="sec status" id="appStatus">…</div>

  <script src="popup.js"></script>
</body>
</html>
