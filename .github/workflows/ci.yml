name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit & Engine tests
        run: npm test

  build:
    name: Build installers (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: |
              build-out/*.exe
              build-out/*.zip
              build-out/*.yml
              build-out/*.blockmap
          - os: macos-latest
            args: --mac
            files: |
              build-out/*-mac.*
          - os: ubuntu-latest
            args: --linux
            files: |
              build-out/*-linux.*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build ${{ matrix.os }} packages
        run: npx electron-builder ${{ matrix.args }} --publish never --config.directories.output=build-out

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
